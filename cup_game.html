<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컵 물 옮기기</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="컵 물 옮기기">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow-x:hidden;background:#1d2a44;color:#fff;font-family:"Malgun Gothic",sans-serif}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:14px;background:#1d2a44;overflow:hidden}
.screen.show{display:flex}
button{font:inherit;color:#fff;border:0;border-radius:14px;background:#3b82f6;padding:12px 20px;font-size:18px;font-weight:bold;cursor:pointer;max-width:100%}
button:active{transform:scale(.96)}
button.sub{background:#475569;font-size:16px;padding:10px 14px}
#poster{max-width:100%;max-height:60vh;border-radius:14px;object-fit:contain}
#title{font-size:34px;font-weight:bold;text-align:center}
#startBtn{font-size:26px;padding:16px 48px}
.hud{display:flex;gap:10px;width:100%;max-width:390px}
.hud div{flex:1;background:#2c3e66;border-radius:14px;padding:8px;text-align:center}
.hud small{display:block;font-size:14px;color:#9fb3d9}
.hud b{font-size:36px;line-height:1.1}
canvas{display:block;touch-action:manipulation;background:#e8eef8;border-radius:14px}
#msg{min-height:24px;font-size:17px;color:#ffe08a;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#overlay{background:rgba(10,16,32,.88);z-index:5}
#endVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#endUi{position:relative;z-index:2;text-align:center;display:none;flex-direction:column;gap:14px;align-items:center;background:rgba(0,0,0,.55);padding:20px;border-radius:16px}
#endUi h2{font-size:30px}
</style>
</head>
<body>

<div class="screen show" id="startScreen">
  <div id="title">컵 물 옮기기</div>
  <img id="poster" src="poster.png" alt="">
  <button id="startBtn">시작</button>
</div>

<div class="screen" id="modeScreen">
  <div id="title">난이도 선택</div>
  <button id="kidBtn" style="font-size:26px;padding:20px 40px">4세용</button>
  <button id="adultBtn" style="font-size:26px;padding:20px 40px;background:#ef4444">어른용</button>
</div>

<div class="screen" id="gameScreen">
  <div class="hud">
    <div><small>단계</small><b id="lvl">1/5</b></div>
    <div><small>옮긴 횟수</small><b id="moves">0</b></div>
  </div>
  <canvas id="cv"></canvas>
  <div id="msg"></div>
  <div class="row">
    <button class="sub" id="undoBtn">↩ 되돌리기</button>
    <button class="sub" id="resetBtn">⟲ 다시 섞기</button>
    <button class="sub" id="musicBtn">음악 끄기</button>
  </div>
</div>

<div class="screen" id="overlay">
  <h2 id="ovTitle">단계 클리어!</h2>
  <p id="ovInfo" style="font-size:20px;text-align:center;line-height:1.7"></p>
  <button id="nextBtn">다음 단계</button>
</div>

<div class="screen" id="endScreen" style="padding:0;background:#000">
  <video id="endVideo" src="ending.mp4" playsinline preload="auto"></video>
  <div id="endUi">
    <h2>🎉 모든 단계 성공!</h2>
    <p id="endInfo" style="font-size:20px;line-height:1.7"></p>
    <button id="shareBtn" style="background:#16a34a">점수 공유하기</button>
    <div id="shareMsg" style="font-size:15px;color:#ffe08a;max-width:300px;word-break:break-all"></div>
    <button id="againBtn">다시 하기</button>
  </div>
</div>

<script>
(function(){
  var COLORS=[
    {n:'빨강',c:'#e53935'},{n:'주황',c:'#fb8c00'},{n:'노랑',c:'#fdd835'},
    {n:'초록',c:'#43a047'},{n:'파랑',c:'#1e88e5'},{n:'옅은 회색',c:'#b4bcc8'},{n:'검정',c:'#111111'}
  ];
  // colors: 색 수, cups: 컵 수(2~5), cap: 컵 용량
  var MODES={
    kid:[
      {colors:2,cups:3,cap:3},{colors:2,cups:3,cap:4},{colors:3,cups:4,cap:4},
      {colors:3,cups:5,cap:4},{colors:4,cups:5,cap:4}
    ],
    adult:[
      {colors:4,cups:6,cap:4},{colors:5,cups:7,cap:4},{colors:5,cups:7,cap:5},
      {colors:6,cups:8,cap:5},{colors:7,cups:10,cap:5}
    ]
  };
  var LEVELS=MODES.kid;
  var $=function(id){return document.getElementById(id)};
  var cv=$('cv'),ctx=cv.getContext('2d');
  var level=0,cups=[],cap=4,hist=[],moves=0,sel=-1,done=false,palette=[];
  var musicOn=true,layout=[];

  /* ---------- 미디어 (없어도 건너뜀) ---------- */
  var poster=$('poster');
  poster.addEventListener('error',function(){poster.style.display='none'});
  var music=null;
  try{
    music=new Audio('music.mp3');music.loop=true;
    music.addEventListener('error',function(){music=null;$('musicBtn').style.display='none'});
  }catch(e){music=null}
  function playMusic(){
    if(!music||!musicOn)return;
    try{var p=music.play();if(p&&p.catch)p.catch(function(){})}catch(e){}
  }
  $('musicBtn').onclick=function(){
    musicOn=!musicOn;
    $('musicBtn').textContent=musicOn?'음악 끄기':'음악 켜기';
    if(!music)return;
    if(musicOn)playMusic();else{try{music.pause()}catch(e){}}
  };

  var vid=$('endVideo'),endUi=$('endUi');
  function showEndUi(){endUi.style.display='flex'}
  vid.addEventListener('error',showEndUi);
  vid.addEventListener('ended',showEndUi);

  /* ---------- 화면 전환 ---------- */
  function show(id){
    ['startScreen','modeScreen','gameScreen','overlay','endScreen'].forEach(function(s){
      $(s).classList.toggle('show',s===id);
    });
    if(id==='overlay')$('gameScreen').classList.add('show');
  }

  /* ---------- 퍼즐 생성 ---------- */
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function key(s){return s.map(function(c){return c.join('')}).join('|')}
  function pourState(s,a,b){
    var A=s[a],B=s[b];if(!A.length||a===b)return null;
    var top=A[A.length-1];
    if(B.length>=cap)return null;
    var ns=s.map(function(c){return c.slice()});
    ns[b].push(ns[a].pop());
    return ns;
  }
  function isWin(s){
    return s.every(function(c){
      if(!c.length)return true;
      if(c.length!==cap)return false;
      return c.every(function(x){return x===c[0]});
    });
  }
  function solvable(s){
    var seen={},q=[s],n=0;seen[key(s)]=1;
    while(q.length&&n<60000){
      var cur=q.shift();n++;
      if(isWin(cur))return true;
      for(var a=0;a<cur.length;a++)for(var b=0;b<cur.length;b++){
        var ns=pourState(cur,a,b);
        if(ns){var k=key(ns);if(!seen[k]){seen[k]=1;q.push(ns)}}
      }
    }
    return false;
  }
  function makePuzzle(L){
    cap=L.cap;
    palette=shuffle(COLORS.slice()).slice(0,L.colors);
    // 완성 상태에서 거꾸로 섞기: 모든 이동은 되돌릴 수 있어 항상 풀 수 있음
    // 처음에 한 가지 색만 든 컵(빈 컵 제외)이 없을 때까지 섞음
    function ok(s){return s.every(function(c){return !c.length||c.some(function(x){return x!==c[0]})})}
    var s;
    for(var t=0;t<100;t++){
      s=[];
      for(var i=0;i<L.cups;i++){var c=[];if(i<L.colors)for(var k=0;k<cap;k++)c.push(i);s.push(c)}
      for(var step=0;step<3000;step++){
        var a=Math.floor(Math.random()*L.cups),b=Math.floor(Math.random()*L.cups);
        if(a===b||!s[a].length||s[b].length>=cap)continue;
        s[b].push(s[a].pop());
        if(step>L.colors*cap*3&&ok(s))return s;
      }
    }
    return s;
  }

  /* ---------- 게임 진행 ---------- */
  function startLevel(){
    cups=makePuzzle(LEVELS[level]);
    hist=[];moves=0;sel=-1;done=false;levelStart=Date.now();
    $('lvl').textContent=(level+1)+'/5';
    $('moves').textContent=0;
    $('msg').textContent=level===0?'컵을 눌러 고르고, 옮길 컵을 누르세요':'';
    resize();draw();
  }
  function tryPour(a,b){
    var ns=pourState(cups,a,b);
    if(!ns){
      $('msg').textContent='여유 공간이 없는 컵이에요';
      return;
    }
    hist.push(cups.map(function(c){return c.slice()}));
    $('msg').textContent='';
    var t0=null,dur=380;
    anim={a:a,b:b,color:cups[a][cups[a].length-1],p:0};
    function step(ts){
      if(t0===null)t0=ts;
      var q=Math.min(1,(ts-t0)/dur);
      anim.p=q*q*(3-2*q);
      draw();
      if(q<1){requestAnimationFrame(step);return}
      anim=null;cups=ns;moves++;$('moves').textContent=moves;draw();
      if(isWin(cups)){done=true;winTime=Date.now();setTimeout(levelClear,1000)}
    }
    requestAnimationFrame(step);
  }
  // 점수(100점 만점) = 이동 횟수 60% + 걸린 시간 40%
  function levelClear(){
    var L=LEVELS[level],sec=Math.max(1,Math.round((winTime-levelStart)/1000));
    // 100점에서 시작, 제한 시간(1단계 50초, 단계마다 +5초)을 넘긴 시간 1초당 1점 감점(최소 0점)
    var limit=50+level*5;
    // 기준 이동 횟수(전체 칸 수의 2배)를 넘긴 이동 2번당 1점 추가 감점
    var parMoves=L.colors*L.cap*2;
    var timeLoss=Math.max(0,sec-limit),moveLoss=Math.round(Math.max(0,moves-parMoves)/2);
    var sc=Math.max(0,100-timeLoss-moveLoss);
    scores.push(sc);totalMoves+=moves;totalSec+=sec;
    var info='옮긴 횟수 '+moves+'번 · 걸린 시간 '+sec+'초<br><small style="font-size:15px;color:#9fb3d9">시간 -'+timeLoss+' · 횟수 -'+moveLoss+' (기준 '+limit+'초 / '+parMoves+'번)</small><br><b style="font-size:34px;color:#ffe08a">'+sc+'점</b> / 100점';
    if(level>=LEVELS.length-1){
      finalScore=Math.round(scores.reduce(function(a,b){return a+b},0)/scores.length);
      $('endInfo').innerHTML='5단계: '+info+'<hr style="margin:8px 0;border:0;border-top:1px solid #fff5">'
        +'전체 옮긴 횟수 '+totalMoves+'번 · 전체 시간 '+totalSec+'초<br>최종 점수 <b style="font-size:42px;color:#ffe08a">'+finalScore+'점</b> / 100점';
      gameClear();return;
    }
    $('ovInfo').innerHTML=info;
    $('ovTitle').textContent='단계 '+(level+1)+' 클리어!';
    show('overlay');
  }
  $('nextBtn').onclick=function(){level++;show('gameScreen');startLevel()};
  function gameClear(){
    endUi.style.display='none';
    show('endScreen');
    if(music){try{music.pause()}catch(e){}}
    try{
      var p=vid.play();
      if(p&&p.catch)p.catch(showEndUi);
    }catch(e){showEndUi()}
  }
  $('againBtn').onclick=function(){
    try{vid.pause();vid.currentTime=0}catch(e){}
    show('modeScreen');playMusic();
  };
  $('shareBtn').onclick=function(){
    var url='https://rkado1020-max.github.io/rabbit-carrot-dodge/cup_game.html';
    var text='컵 물 옮기기('+modeName+') 5단계 클리어! 최종 '+finalScore+'점 / 100점 (총 '+totalMoves+'번, '+totalSec+'초) 도전해 보세요!';
    var msg=$('shareMsg');
    function fallback(){
      var all=text+' '+url;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(all).then(function(){msg.textContent='점수와 주소를 복사했어요. 붙여넣어 공유하세요!'},
          function(){msg.textContent=all});
      }else msg.textContent=all;
    }
    try{
      if(navigator.share){
        navigator.share({title:'컵 물 옮기기',text:text,url:url}).catch(function(e){
          if(!e||e.name!=='AbortError')fallback();
        });
      }else fallback();
    }catch(e){fallback()}
  };
  $('undoBtn').onclick=function(){
    if(done||anim||!hist.length)return;
    cups=hist.pop();moves++;$('moves').textContent=moves;sel=-1;draw();
  };
  $('resetBtn').onclick=function(){if(!done&&!anim)startLevel()};
  $('startBtn').onclick=function(){show('modeScreen');playMusic()};
  function begin(m){LEVELS=MODES[m];modeName=m==='kid'?'4세용':'어른용';level=0;scores=[];totalMoves=0;totalSec=0;show('gameScreen');startLevel()}
  $('kidBtn').onclick=function(){begin('kid')};
  $('adultBtn').onclick=function(){begin('adult')};

  /* ---------- 그리기 ---------- */
  var W=300,H=300;
  function resize(){
    var w=Math.min(390,window.innerWidth-24);
    W=Math.max(240,w);
    var n=cups.length||3,gap=10,per=n>6?Math.ceil(n/2):n,rows=n>6?2:1;
    H=rows===1?270:400;
    var d=window.devicePixelRatio||1;
    cv.style.width=W+'px';cv.style.height=H+'px';
    cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    var cw=Math.min(64,(W-gap*(per+1))/per);
    var rh=H/rows,unit=Math.min(34,(rh-44)/cap),ch=unit*cap+10;
    layout=[];
    for(var i=0;i<n;i++){
      var r=Math.floor(i/per),col=i%per,cnt=Math.min(per,n-r*per);
      var x0=(W-(cnt*cw+(cnt-1)*gap))/2;
      layout.push({x:x0+col*(cw+gap),y:r*rh+(rh-ch)/2+12,w:cw,h:ch,u:unit});
    }
    draw();
  }
  function rr(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.closePath();
  }
  function isSealed(i){var s=cups[i];return !!s&&s.length===cap&&s.every(function(v){return v===s[0]})}
  var anim=null,scores=[],levelStart=0,winTime=0,totalMoves=0,totalSec=0,finalScore=0,modeName='4세용',lids={};
  function drawBlob(){
    if(!anim)return;
    var A=layout[anim.a],B=layout[anim.b],p=anim.p;
    var ax=A.x+A.w/2,ay=A.y-16,bx=B.x+B.w/2,by=B.y-8;
    var x=ax+(bx-ax)*p,y=ay+(by-ay)*p-Math.sin(Math.PI*p)*34;
    ctx.fillStyle=palette[anim.color].c;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    layout.forEach(function(L,i){
      var lift=(i===sel)?-14:0,x=L.x,y=L.y+lift;
      // 물
      ctx.save();rr(x,y,L.w,L.h,10);ctx.clip();
      var s=cups[i]||[];
      var ap=anim?anim.p:0,n2=s.length+((anim&&anim.b===i)?1:0);
      for(var k=0;k<n2;k++){
        var cIdx=k<s.length?s[k]:anim.color;
        var f=1,by=y+L.h-(k+1)*L.u-2;
        if(anim&&anim.a===i&&k===s.length-1)f=1-ap;
        if(anim&&anim.b===i&&k===s.length)f=ap;
        if(f<=0)continue;
        var top=by+L.u*(1-f);
        ctx.fillStyle=palette[cIdx].c;
        ctx.fillRect(x,top,L.w,L.u*f+0.5);
        ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;
        ctx.strokeRect(x+.5,top+.5,L.w-1,Math.max(0,L.u*f-1));
      }
      ctx.restore();
      // 컵 테두리
      ctx.lineWidth=4;
      ctx.strokeStyle=i===sel?'#2563eb':'#5b6b8c';
      rr(x,y,L.w,L.h,10);ctx.stroke();
      // 한 색으로 가득 차면 뚜껑을 닫음
      if(isSealed(i)&&!(anim&&(anim.a===i||anim.b===i))){
        if(!lids[i])lids[i]=performance.now();
        var lp=Math.min(1,(performance.now()-lids[i])/400);
        if(lp<1)requestAnimationFrame(draw);
        var e=1-Math.pow(1-lp,3),lh=12,lx=x-5,lw=L.w+10,ly=y-4-lh-(1-e)*36;
        ctx.fillStyle='#f59e0b';ctx.strokeStyle='#92400e';ctx.lineWidth=2;
        rr(lx,ly,lw,lh,5);ctx.fill();ctx.stroke();
        ctx.fillStyle='#fcd34d';ctx.beginPath();ctx.arc(x+L.w/2,ly-3,5,0,Math.PI*2);ctx.fill();ctx.stroke();
      }else delete lids[i];
    });
    drawBlob();
  }
  function pick(ev){
    var r=cv.getBoundingClientRect();
    var x=ev.clientX-r.left,y=ev.clientY-r.top;
    for(var i=0;i<layout.length;i++){
      var L=layout[i];
      if(x>=L.x-4&&x<=L.x+L.w+4&&y>=L.y-24&&y<=L.y+L.h+6)return i;
    }
    return -1;
  }
  cv.addEventListener('click',function(ev){
    if(done||anim)return;
    var i=pick(ev);if(i<0){sel=-1;draw();return}
    if(sel<0){
      if(!cups[i].length){$('msg').textContent='빈 컵이에요. 물이 든 컵을 먼저 고르세요';return}
      if(isSealed(i)){$('msg').textContent='뚜껑이 닫힌 완성된 컵이에요';return}
      sel=i;$('msg').textContent='';
    }else if(sel===i){sel=-1}
    else{var a=sel;sel=-1;tryPour(a,i)}
    draw();
  });
  // 웹앱(PWA): 주소가 http(s)일 때만 서비스 워커 등록. 실패해도 게임은 그대로 진행
  try{
    if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  }catch(e){}
  window.addEventListener('resize',resize);
  resize();
})();
</script>
</body>
</html>
