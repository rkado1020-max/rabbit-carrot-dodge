<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토끼 당근 받기</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
    background: #dff3ff;
    color: #3b2a1a;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }

  .app {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 8px 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 점수 · 남은 시간 · 음악 */
  .hud {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 6px 12px;
  }
  .hud .lbl { display: block; font-size: 13px; font-weight: 700; color: #6b5640; line-height: 1.2; }
  .score .num, .time .num { font-size: 36px; font-weight: 900; line-height: 1; color: #d9480f; }
  .time .num { color: #1c7ed6; }
  .score .goal, .time .goal { font-size: 14px; font-weight: 700; color: #6b5640; margin-left: 2px; }
  .mini {
    min-height: 44px;
    padding: 6px 12px;
    border: 2px solid #8a6a4a;
    border-radius: 12px;
    background: #fff8e8;
    color: #5a4128;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .mini:disabled { opacity: .5; cursor: default; }

  .level {
    width: 100%;
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    line-height: 1.1;
    color: #5a4128;
  }
  .level b { color: #d9480f; font-size: 38px; display: inline-block; }
  .level small { font-size: 16px; color: #6b5640; }
  .level b.pop { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }

  .bar { width: 100%; height: 8px; border-radius: 4px; background: #c9e4f5; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: #ff8a1f; }

  /* 게임 화면 */
  .stage {
    position: relative;
    width: min(100%, calc((100vh - 260px) * 0.75));
    min-width: 240px;
    aspect-ratio: 3 / 4;
    border-radius: 14px;
    overflow: hidden;
    border: 3px solid #8a6a4a;
    background: #bfe9ff;
  }
  @supports (height: 100dvh) {
    .stage { width: min(100%, calc((100dvh - 260px) * 0.75)); }
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    text-align: center;
  }
  .hide { display: none !important; }

  .big {
    min-width: 170px;
    min-height: 56px;
    padding: 10px 28px;
    border: 3px solid #b3470a;
    border-radius: 16px;
    background: #ff8a1f;
    color: #fff;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 0 #b3470a;
  }
  .big:active { transform: translateY(3px); box-shadow: 0 1px 0 #b3470a; }

  #startOv { background: linear-gradient(#bfe9ff, #fff3d6); justify-content: flex-start; }
  #poster { flex: 1 1 0; width: 100%; min-height: 0; object-fit: contain; display: block; }
  #posterFallback h1 { margin: 0 0 6px; font-size: 32px; color: #d9480f; }
  #posterFallback p { margin: 0; font-size: 16px; font-weight: 700; color: #6b5640; }
  .hint { margin: 0; font-size: 14px; font-weight: 700; color: #6b5640; }

  #overOv { background: rgba(40, 25, 10, .6); color: #fff; }
  #overOv h2, .endPanel h2 { margin: 0; font-size: 40px; font-weight: 900; }
  #overOv p, .endPanel p { margin: 0 0 8px; font-size: 20px; font-weight: 700; }

  /* 클리어 영상: 화면 전체를 덮음 */
  #ending {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #1c1410;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #endVideo { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .endPanel {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(88%, 340px);
    padding: 20px 16px;
    border-radius: 18px;
    background: rgba(28, 20, 16, .78);
    color: #fff;
    text-align: center;
  }

  /* 조작 버튼 */
  .pad { width: 100%; display: flex; gap: 12px; }
  .move {
    flex: 1 1 0;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 3px solid #8a6a4a;
    border-radius: 18px;
    background: #fff8e8;
    color: #5a4128;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    box-shadow: 0 4px 0 #8a6a4a;
  }
  .move.on, .move:active { background: #ffe2b8; transform: translateY(3px); box-shadow: 0 1px 0 #8a6a4a; }
  .move i { display: block; width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
  .move.l i { border-right: 16px solid #d9480f; }
  .move.r i { border-left: 16px solid #d9480f; }
</style>
</head>
<body>
<div class="app">
  <div class="level" aria-live="polite">레벨 <b id="level">1</b> <small>/ 3</small></div>
  <header class="hud">
    <div class="score">
      <span class="lbl">점수</span>
      <span><span class="num" id="score">0</span><span class="goal">/ 100</span></span>
    </div>
    <div class="time">
      <span class="lbl">남은 시간</span>
      <span><span class="num" id="time">300</span><span class="goal">초</span></span>
    </div>
    <button class="mini" id="musicBtn" type="button">음악 끄기</button>
  </header>
  <div class="bar"><i id="barFill"></i></div>

  <div class="stage" id="stage">
    <canvas id="game" width="360" height="480"></canvas>

    <div class="overlay" id="startOv">
      <img id="poster" src="poster.png" alt="">
      <div id="posterFallback" class="hide">
        <h1>토끼 당근 받기</h1>
        <p>당근과 사탕은 받고, 운석은 피해요!</p>
      </div>
      <p class="hint">당근 +1 · 사탕 +3 · 운석 -5<br>100점을 모으면 클리어! (제한 시간 300초)</p>
      <button class="big" id="startBtn" type="button">시작</button>
    </div>

    <div class="overlay hide" id="overOv">
      <h2 id="overTitle">시간 종료</h2>
      <p id="overScore">점수 0</p>
      <button class="big" id="retryBtn" type="button">다시 하기</button>
    </div>
  </div>

  <div class="pad">
    <button class="move l" id="leftBtn" type="button" aria-label="왼쪽으로 이동"><i></i>왼쪽</button>
    <button class="move r" id="rightBtn" type="button" aria-label="오른쪽으로 이동">오른쪽<i></i></button>
  </div>
</div>

<div id="ending" class="hide">
  <video id="endVideo" src="ending.mp4" playsinline preload="none"></video>
  <div class="endPanel hide" id="endPanel">
    <h2>클리어!</h2>
    <p>100점을 모았어요!</p>
    <button class="big" id="againBtn" type="button">다시 하기</button>
  </div>
</div>

<audio id="bgm" src="music.mp3" loop preload="none"></audio>

<script>
(function () {
  'use strict';

  var W = 360, H = 480;
  var GROUND = H - 14;
  var WIN_SCORE = 100;    // 이 점수가 되면 클리어
  var TIME_LIMIT = 300;   // 초. 시간이 끝나면 게임 종료
  var POINTS = { carrot: 1, meteor: -5, candy: 3 };
  // 떨어지는 확률: 당근 60%, 운석 25%, 사탕 15%
  function pickType() {
    var r = Math.random();
    return r < 0.6 ? 'carrot' : (r < 0.85 ? 'meteor' : 'candy');
  }
  var SPEED = 260;        // 버튼·키보드 이동 속도(px/s)
  var DRAG_SPEED = 900;   // 끌 때 따라오는 최대 속도
  var RABBIT_S = 0.75;

  function $(id) { return document.getElementById(id); }
  var canvas = $('game'), ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  var scoreEl = $('score'), timeEl = $('time'), barFill = $('barFill');
  var startOv = $('startOv'), overOv = $('overOv'), overScore = $('overScore'), overTitle = $('overTitle');
  var ending = $('ending'), endVideo = $('endVideo'), endPanel = $('endPanel');
  var poster = $('poster'), posterFallback = $('posterFallback');
  var bgm = $('bgm'), musicBtn = $('musicBtn');

  /* ---------- 상태 ---------- */
  var state = 'ready';   // ready | play | over | clear
  var elapsed = 0, score = 0, level = 1;
  var items = [], floats = [], spawnTimer = 0, lastSpawnX = W / 2;
  var rabbit = { x: W / 2, lean: 0, k: 1 };   // k: 레벨에 따른 크기 배율
  var LEVEL_SIZE = [1, 1.25, 1.5];            // 레벨 1·2·3의 토끼 크기
  // 50점 이상이면 2레벨, 80점 이상이면 3레벨
  function levelOf(s) { return s >= 80 ? 3 : (s >= 50 ? 2 : 1); }
  var keys = { left: false, right: false };
  var hold = { left: false, right: false };
  var dragging = false, dragX = 0;
  var clock = 0;

  /* ---------- 미디어: 없어도 그냥 건너뜀 ---------- */
  var musicOn = true, musicFailed = false, videoFailed = false;

  function failPoster() {
    poster.classList.add('hide');
    posterFallback.classList.remove('hide');
  }
  poster.addEventListener('error', failPoster);
  if (poster.complete && poster.naturalWidth === 0) failPoster();

  function refreshMusicBtn() {
    if (musicFailed) { musicBtn.textContent = '음악 없음'; musicBtn.disabled = true; return; }
    musicBtn.disabled = false;
    musicBtn.textContent = musicOn ? '음악 끄기' : '음악 켜기';
  }
  function playMusic() {
    if (!musicOn || musicFailed) return;
    try {
      var p = bgm.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }
  function stopMusic() { try { bgm.pause(); } catch (e) {} }
  bgm.volume = 0.5;
  bgm.addEventListener('error', function () { musicFailed = true; refreshMusicBtn(); });
  musicBtn.addEventListener('click', function () {
    if (musicFailed) return;
    musicOn = !musicOn;
    refreshMusicBtn();
    if (musicOn) { if (state === 'play' || state === 'over') playMusic(); }
    else stopMusic();
  });
  refreshMusicBtn();

  function showEndPanel() { endPanel.classList.remove('hide'); }
  endVideo.addEventListener('error', function () {
    videoFailed = true;
    endVideo.classList.add('hide');
    if (state === 'clear') showEndPanel();
  });
  endVideo.addEventListener('ended', showEndPanel);

  function playEnding() {
    ending.classList.remove('hide');
    endPanel.classList.add('hide');
    if (videoFailed) { endVideo.classList.add('hide'); showEndPanel(); return; }
    endVideo.classList.remove('hide');
    endVideo.muted = false;
    try { endVideo.currentTime = 0; } catch (e) {}
    try {
      var p = endVideo.play();
      if (p && p.catch) {
        p.catch(function () {
          if (videoFailed) { showEndPanel(); return; }
          // 소리 재생이 막혔으면 무음으로 한 번 더 시도
          try {
            endVideo.muted = true;
            var q = endVideo.play();
            if (q && q.catch) q.catch(showEndPanel);
          } catch (e) { showEndPanel(); }
        });
      }
    } catch (e) { showEndPanel(); }
  }
  function stopEnding() {
    try { endVideo.pause(); } catch (e) {}
    ending.classList.add('hide');
    endPanel.classList.add('hide');
  }

  /* ---------- 게임 흐름 ---------- */
  function seedItem(y, type) {
    items.push({ x: 24 + Math.random() * (W - 48), y: y, v: 100 + Math.random() * 20, ph: Math.random() * 6.28, type: type });
  }
  function resetGame() {
    elapsed = 0; score = 0; level = 1;
    items = []; floats = []; spawnTimer = 0.6;
    rabbit.x = W / 2; rabbit.lean = 0; rabbit.k = 1;
    dragging = false;
    seedItem(40, 'carrot'); seedItem(120, 'carrot'); seedItem(200, 'candy');
    updateHud();
  }
  function startGame() {
    stopEnding();
    startOv.classList.add('hide');
    overOv.classList.add('hide');
    resetGame();
    state = 'play';
    playMusic();
  }
  function gameOver() {
    state = 'over';
    overTitle.textContent = '시간 종료';
    overScore.textContent = '점수 ' + score + ' / ' + WIN_SCORE;
    overOv.classList.remove('hide');
  }
  function clearGame() {
    state = 'clear';
    updateHud();
    stopMusic();
    playEnding();
  }

  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);

  /* ---------- 점수·시간·레벨 표시 ---------- */
  var shownScore = -1, shownTime = -1, shownLevel = 0;
  var levelEl = $('level');
  function updateHud() {
    if (score !== shownScore) {
      shownScore = score;
      scoreEl.textContent = score;
      barFill.style.width = Math.max(0, Math.min(100, score / WIN_SCORE * 100)) + '%';
    }
    var left = Math.max(0, Math.ceil(TIME_LIMIT - elapsed));
    if (left !== shownTime) { shownTime = left; timeEl.textContent = left; }
    if (level !== shownLevel) {
      var up = shownLevel > 0 && level > shownLevel;
      shownLevel = level;
      levelEl.textContent = level;
      levelEl.classList.remove('pop');
      if (up) { void levelEl.offsetWidth; levelEl.classList.add('pop'); }
    }
  }

  /* ---------- 업데이트 ---------- */
  function rabbitBox() {
    var k = rabbit.k;   // 토끼가 커지면 판정도 같이 커짐
    return { l: rabbit.x - 12 * k, r: rabbit.x + 12 * k, t: GROUND - 36 * k, b: GROUND - 3 * k };
  }
  function itemBox(c) {
    if (c.type === 'candy') return { l: c.x - 8, r: c.x + 8, t: c.y - 8, b: c.y + 8 };
    if (c.type === 'meteor') return { l: c.x - 8, r: c.x + 8, t: c.y - 8, b: c.y + 8 };
    return { l: c.x - 7, r: c.x + 7, t: c.y - 10, b: c.y + 16 };
  }
  function update(dt) {
    if (floats.length) {
      for (var f = floats.length - 1; f >= 0; f--) {
        floats[f].age += dt;
        if (floats[f].age > 0.8) floats.splice(f, 1);
      }
    }
    if (state !== 'play') return;
    elapsed += dt;
    // 레벨은 올라가기만 함: 운석으로 점수가 깎여도 토끼가 다시 작아지지 않음
    level = Math.max(level, levelOf(score));
    rabbit.k += (LEVEL_SIZE[level - 1] - rabbit.k) * Math.min(1, dt * 8);

    // 이동
    var dir = ((keys.right || hold.right) ? 1 : 0) - ((keys.left || hold.left) ? 1 : 0);
    var before = rabbit.x;
    if (dir) {
      rabbit.x += dir * SPEED * dt;
    } else if (dragging) {
      var d = dragX - rabbit.x, step = DRAG_SPEED * dt;
      rabbit.x += Math.abs(d) <= step ? d : (d > 0 ? step : -step);
    }
    rabbit.x = Math.max(18 * rabbit.k, Math.min(W - 18 * rabbit.k, rabbit.x));
    var vx = (rabbit.x - before) / dt;
    rabbit.lean += (Math.max(-1, Math.min(1, vx / 300)) - rabbit.lean) * Math.min(1, dt * 12);

    // 낙하물 만들기 (천천히, 점점 아주 조금만 빨라짐)
    var p = Math.min(1, elapsed / TIME_LIMIT);
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer += 0.85 - 0.2 * p;
      var x = 24 + Math.random() * (W - 48);
      if (Math.abs(x - lastSpawnX) < 30) x = x > W / 2 ? x - 60 : x + 60;
      x = Math.max(24, Math.min(W - 24, x));
      lastSpawnX = x;
      items.push({ x: x, y: -40, v: 100 + 30 * p + Math.random() * 20, ph: Math.random() * 6.28, type: pickType() });
    }
    for (var i = items.length - 1; i >= 0; i--) {
      items[i].y += items[i].v * dt;
      if (items[i].y > H + 50) items.splice(i, 1);
    }

    // 받기: 닿으면 점수가 바뀌고 낙하물은 사라짐 (점수는 0 아래로 내려가지 않음)
    var rb = rabbitBox();
    for (var j = items.length - 1; j >= 0; j--) {
      var it = items[j], cb = itemBox(it);
      if (rb.l < cb.r && rb.r > cb.l && rb.t < cb.b && rb.b > cb.t) {
        var pts = POINTS[it.type];
        score = Math.max(0, score + pts);
        floats.push({ x: it.x, y: Math.min(it.y, GROUND - 40), text: (pts > 0 ? '+' : '') + pts, color: pts > 0 ? '#d9480f' : '#c92a2a', age: 0 });
        items.splice(j, 1);
      }
    }
    level = Math.max(level, levelOf(score));
    updateHud();
    if (score >= WIN_SCORE) { clearGame(); return; }
    if (elapsed >= TIME_LIMIT) gameOver();
  }

  /* ---------- 그리기 ---------- */
  function ell(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }
  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ell(x, y, 28 * s, 11 * s); ctx.fill();
    ell(x - 14 * s, y - 6 * s, 14 * s, 11 * s); ctx.fill();
    ell(x + 8 * s, y - 9 * s, 16 * s, 13 * s); ctx.fill();
  }
  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#9fdcff');
    g.addColorStop(1, '#e8f8ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    drawCloud(((clock * 8) % (W + 120)) - 60, 70, 1);
    drawCloud(((clock * 5 + 200) % (W + 120)) - 60, 150, 0.8);
    drawCloud(((clock * 11 + 90) % (W + 120)) - 60, 240, 0.65);
    ctx.fillStyle = '#7ccf6b';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#5fb454';
    ctx.fillRect(0, GROUND, W, 4);
  }
  function drawCandy(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(Math.sin(clock * 3 + c.ph) * 0.35);
    ctx.scale(0.9, 0.9);
    // 포장지 양쪽 끝
    ctx.fillStyle = '#ffd43b';
    ctx.strokeStyle = '#c98a00';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-7, 0); ctx.lineTo(-18, -8); ctx.lineTo(-18, 8); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(7, 0); ctx.lineTo(18, -8); ctx.lineTo(18, 8); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 사탕 알맹이
    ctx.fillStyle = '#ff5c8a';
    ctx.strokeStyle = '#c2255c';
    ctx.lineWidth = 2;
    ell(0, 0, 10, 10); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 5.5, -2.2, 0.6); ctx.stroke();
    ctx.restore();
  }
  function drawMeteor(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(0.9, 0.9);
    // 위쪽으로 길게 남는 불꽃
    var fl = 1 + Math.sin(clock * 20 + c.ph) * 0.12;
    ctx.fillStyle = 'rgba(255,140,0,.55)';
    ctx.beginPath();
    ctx.moveTo(-9, -4); ctx.quadraticCurveTo(0, -48 * fl, 9, -4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,80,.7)';
    ctx.beginPath();
    ctx.moveTo(-5, -4); ctx.quadraticCurveTo(0, -28 * fl, 5, -4); ctx.closePath(); ctx.fill();
    // 바위
    ctx.beginPath();
    ctx.moveTo(-10, -4); ctx.lineTo(-5, -11); ctx.lineTo(5, -10); ctx.lineTo(11, -3);
    ctx.lineTo(9, 7); ctx.lineTo(1, 12); ctx.lineTo(-8, 8); ctx.closePath();
    ctx.fillStyle = '#6b5b53';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#3d312c';
    ctx.stroke();
    ctx.fillStyle = '#4a3d37';
    ell(-3, -2, 3, 2.5); ctx.fill();
    ell(4, 4, 2.5, 2); ctx.fill();
    ell(4, -5, 1.8, 1.5); ctx.fill();
    ctx.restore();
  }
  function drawFloats() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '900 26px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#fff';
    for (var i = 0; i < floats.length; i++) {
      var f = floats[i];
      ctx.globalAlpha = Math.max(0, 1 - f.age / 0.8);
      var y = f.y - f.age * 50;
      ctx.strokeText(f.text, f.x, y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, y);
    }
    ctx.restore();
  }
  function drawItem(c) {
    if (c.type === 'candy') { drawCandy(c); return; }
    if (c.type === 'meteor') { drawMeteor(c); return; }
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(Math.sin(clock * 3 + c.ph) * 0.12);
    ctx.scale(0.85, 0.85);
    // 잎
    ctx.fillStyle = '#3fae49';
    ell(-6, -26, 3.8, 10, -0.5); ctx.fill();
    ell(6, -26, 3.8, 10, 0.5); ctx.fill();
    ell(0, -29, 4, 12, 0); ctx.fill();
    // 몸통
    ctx.beginPath();
    ctx.moveTo(-11, -14);
    ctx.quadraticCurveTo(0, -22, 11, -14);
    ctx.quadraticCurveTo(8, 10, 0, 26);
    ctx.quadraticCurveTo(-8, 10, -11, -14);
    ctx.closePath();
    ctx.fillStyle = '#ff8a1f';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#c4560c';
    ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#e06a0c';
    ctx.beginPath();
    ctx.moveTo(-6, -6); ctx.lineTo(-1, -5);
    ctx.moveTo(6, 2); ctx.lineTo(1, 3);
    ctx.moveTo(-3, 11); ctx.lineTo(1, 12);
    ctx.stroke();
    ctx.restore();
  }
  function drawRabbit() {
    ctx.save();
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ell(rabbit.x, GROUND + 1, 17 * rabbit.k, 4); ctx.fill();

    ctx.translate(rabbit.x, GROUND);
    ctx.rotate(rabbit.lean * 0.12);
    ctx.scale(RABBIT_S * rabbit.k, RABBIT_S * rabbit.k);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#8a7a6a';

    // 귀
    ctx.fillStyle = '#fff';
    ell(-9, -68, 6, 16, -0.18); ctx.fill(); ctx.stroke();
    ell(9, -68, 6, 16, 0.18); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffb3c6';
    ell(-9, -67, 2.8, 11, -0.18); ctx.fill();
    ell(9, -67, 2.8, 11, 0.18); ctx.fill();
    // 꼬리
    ctx.fillStyle = '#fff';
    ell(-19, -12, 6, 6); ctx.fill(); ctx.stroke();
    // 몸
    ell(0, -16, 21, 16); ctx.fill(); ctx.stroke();
    // 발
    ell(-10, -2, 9, 4.5); ctx.fill(); ctx.stroke();
    ell(10, -2, 9, 4.5); ctx.fill(); ctx.stroke();
    // 머리
    ell(0, -40, 16, 14); ctx.fill(); ctx.stroke();
    // 얼굴
    ctx.fillStyle = '#3b2a1a';
    ell(-6, -42, 2.2, 2.8); ctx.fill();
    ell(6, -42, 2.2, 2.8); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,150,.45)';
    ell(-10, -36, 3.5, 2.5); ctx.fill();
    ell(10, -36, 3.5, 2.5); ctx.fill();
    ctx.fillStyle = '#ff7a9a';
    ell(0, -37, 2.5, 1.8); ctx.fill();
    ctx.restore();
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    for (var i = 0; i < items.length; i++) drawItem(items[i]);
    drawRabbit();
    drawFloats();
  }

  var last = 0;
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    clock += dt;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ---------- 조작 ---------- */
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'Left') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'Right') { keys.right = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'Left') keys.left = false;
    else if (k === 'ArrowRight' || k === 'Right') keys.right = false;
  });
  function releaseAll() {
    keys.left = keys.right = false;
    hold.left = hold.right = false;
    dragging = false;
    $('leftBtn').classList.remove('on');
    $('rightBtn').classList.remove('on');
  }
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });
  window.addEventListener('pointerup', function () {
    hold.left = hold.right = false;
    $('leftBtn').classList.remove('on');
    $('rightBtn').classList.remove('on');
  });

  function bindHold(el, side) {
    function down(e) {
      hold[side] = true;
      el.classList.add('on');
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    }
    function up() { hold[side] = false; el.classList.remove('on'); }
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  bindHold($('leftBtn'), 'left');
  bindHold($('rightBtn'), 'right');

  function pointerX(e) {
    var r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) * W / r.width;
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragX = pointerX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) { if (dragging) dragX = pointerX(e); });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- 시작 ---------- */
  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
